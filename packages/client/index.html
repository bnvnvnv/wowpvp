<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wowpvp — M1 移动物理与自由镜头试验场</title>
    <!-- ★ 内联 favicon（奥术紫圆 + 星，14.2 色板）：零素材、零许可。
         没有它，部分浏览器（如 Edge headless）会自动请求 /favicon.ico 得到 404，
         在控制台产生一条资源错误 —— 而 verify:m12 #12d 断言控制台零错误，
         不能让验收结果取决于跑在哪个浏览器上。 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23c39bff'/%3E%3Cpath d='M8 3.2 9.2 6.8 13 8 9.2 9.2 8 12.8 6.8 9.2 3 8 6.8 6.8Z' fill='%23fff'/%3E%3C/svg%3E" />
    <style>
      /* ── M12 字体（assets/art/fonts，来源见 docs/09 §4）──────────
         ★ 只声明拉丁与拉丁扩展子集：中文正文仍走系统字体。
           Alegreya 没有中文字形，整段套上去会让每个汉字都走一次
           fallback，反而比不换字体更慢。数字与标题受益最大，
           而 HUD 里最需要「一眼读准」的恰恰是数字。
         ★ font-display: swap —— 字体没到之前先用系统字体渲染，
           不产生任何不可见文本期（15.2 的施法条读数不能有空窗）。 */
      @font-face {
        font-family: "Alegreya Sans";
        src: url("/art/fonts/alegreya-sans-500-latin.woff2") format("woff2");
        font-weight: 500; font-display: swap;
        unicode-range: U+0000-00FF, U+2000-206F, U+2190-21BB, U+2600-26FF;
      }
      @font-face {
        font-family: "Alegreya Sans";
        src: url("/art/fonts/alegreya-sans-400-latin.woff2") format("woff2");
        font-weight: 400; font-display: swap;
        unicode-range: U+0000-00FF, U+2000-206F, U+2190-21BB, U+2600-26FF;
      }
      @font-face {
        font-family: "Alegreya Sans";
        src: url("/art/fonts/alegreya-sans-700-latin.woff2") format("woff2");
        font-weight: 700; font-display: swap;
        unicode-range: U+0000-00FF, U+2000-206F, U+2190-21BB, U+2600-26FF;
      }
      /* 标题用的衬线体，只给比分/奖励这类「牌面」文字 */
      @font-face {
        font-family: "Cinzel";
        src: url("/art/fonts/cinzel-400-700-latin.woff2") format("woff2");
        font-weight: 400 700; font-display: swap;
        unicode-range: U+0000-00FF, U+2000-206F;
      }

      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #app { width: 100%; height: 100%; overflow: hidden; }
      body {
        font: 13px/1.6 "Alegreya Sans", system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #14161c;
        color: #e6e8ee;
      }
      /* M12 自定义光标。★ 保留 crosshair 作为兜底 —— 素材缺失时
         光标不能变成默认箭头，那会让「现在能不能点」失去提示 */
      #view { display: block; width: 100%; height: 100%;
              cursor: url("/art/ui/cursors/hand-default.png") 4 2, crosshair; }
      #view.cursor-attack { cursor: url("/art/ui/cursors/attack-sword.png") 4 2, crosshair; }
      #view.cursor-friendly { cursor: url("/art/ui/cursors/friendly-shield.png") 4 2, pointer; }

      #hud { position: fixed; inset: 0; pointer-events: none; padding: 14px; }
      .panel {
        position: absolute;
        background: rgba(20, 23, 30, 0.86);
        border: 1px solid #2c313d;
        border-radius: 8px;
        padding: 12px 14px;
        backdrop-filter: blur(6px);
      }

      #stats { top: 14px; left: 14px; min-width: 260px; font-variant-numeric: tabular-nums; }
      #stats .row { display: flex; align-items: baseline; gap: 8px; }
      #stats .row span { color: #8b93a7; width: 84px; flex: none; }
      #stats .row b { color: #e6e8ee; font-weight: 600; }
      #stats .row i { color: #5f6779; font-style: normal; font-size: 11px; margin-left: auto; }
      #stats b.ok { color: #7ee0a0; }
      #stats b.warn { color: #e0b87e; }
      #stats hr { border: 0; border-top: 1px solid #2c313d; margin: 7px 0; }

      /* M8：让开右上角的小地图（168px + 间距）*/
      /* ⚠️ 老的 `calc(100vh - 560px)` 在 720p 上只剩 158px —— 帮助面板
         第一屏就被截断，而它正是新玩家唯一的键位说明（1280×720 实测）。
         `min(70vh, …)` 让大屏仍然受 220px 的上下留白约束，小屏则退到
         「最多占七成高度」而不是一个会算出负数的减法。 */
      #help { top: 196px; right: 14px; max-width: 360px;
              max-height: min(70vh, calc(100vh - 220px));
              overflow-y: auto; pointer-events: auto; }
      #help h3 { font-size: 12px; color: #6f9fd0; margin: 0 0 6px; font-weight: 600; }
      #help h3 + table + h3 { margin-top: 12px; }
      #help table { border-collapse: collapse; width: 100%; }
      #help td { padding: 2px 0; vertical-align: top; }
      #help td:first-child { width: 110px; white-space: nowrap; }
      #help .hint { color: #6b7488; margin-left: 6px; font-size: 11px; }
      #help ul { list-style: none; }
      #help li { color: #a8b0c2; padding: 2px 0 2px 12px; position: relative; }
      #help li::before { content: "·"; position: absolute; left: 2px; color: #6f9fd0; }
      #help b { color: #d9c07e; font-weight: 600; }
      kbd {
        display: inline-block; background: #262b36; border: 1px solid #3a4150;
        border-bottom-width: 2px; border-radius: 4px; padding: 0 5px;
        font: 11px/1.5 ui-monospace, monospace; color: #cfd6e4; margin-right: 3px;
      }

      /* ── M9 可访问性（规格书 17.2）─────────────────────────────
         界面缩放与语义色都走 CSS 自定义属性，由 CombatHud.applyAccessibility()
         写在 #combat-hud 上。★ 挂在根节点上是有意的：15.1 的四区加装备栏共五块
         面板，逐块应用一定会漏，而漏掉的那块只有把缩放调到 2.0 的人才会发现。
         下面的默认值仅在 JS 还没写入时生效。                              */
      #combat-hud {
        --ui-scale: 1;
        --c-hostile: #e5484d;
        --c-friendly: #30a46c;
        --c-neutral: #f5d90a;
        --c-danger: #e5484d;
        --c-own-flag: #e5484d;
        --c-enemy-flag: #3e63dd;
      }
      /* 17.2 界面缩放。★ 姓名板层排除在外 —— 它的 transform 是**投影坐标**，
         再套一层 scale 会让姓名板与 3D 里的角色错位。缩放要的是「UI 更大」，
         不是「把整个画面放大」。 */
      #combat-hud > *:not(#nameplates) {
        transform-origin: top left;
        zoom: var(--ui-scale);
      }
      /* 17.2 第三句：四项各自独立。这两条 class 由 applyAccessibility 切换 */
      #combat-hud.no-damage-numbers .damage-number { display: none !important; }
      #combat-hud.no-screen-flash .screen-flash { display: none !important; }

      /* ── M2 战斗 HUD（规格书 15.1 / 15.2）───────────────────── */
      #combat-hud { position: fixed; inset: 0; pointer-events: none; }
      #combat-hud .unit-frame {
        position: absolute; width: 260px; padding: 8px 10px;
        background: rgba(20,23,30,.88); border: 1px solid #2c313d; border-radius: 8px;
      }
      #target-frame { top: 14px; left: 50%; transform: translateX(-50%); }
      #focus-frame { top: 14px; left: calc(50% + 145px); }
      .uf-label { font-size: 10px; color: #6f7A90; letter-spacing: 1px; }
      .uf-name { font-weight: 600; margin-bottom: 4px; }
      .uf-meta { display: flex; gap: 8px; font-size: 11px; color: #8b93a7; margin-top: 4px; }
      .uf-meta .dbf { color: #e0a87e; }
      .flag { color: #e0c07e; font-size: 11px; }

      .bar { position: relative; height: 18px; border-radius: 4px; overflow: hidden;
             background: #22262f; border: 1px solid #333a47; }
      .bar i { position: absolute; inset: 0 auto 0 0; display: block; }
      .bar span { position: relative; display: flex; align-items: center; gap: 5px;
                  height: 100%; padding: 0 6px; font-size: 11px; }
      .bar em { font-style: normal; color: #aab2c4; font-size: 10px; }
      .bar.hp i { background: linear-gradient(#3f9b5d, #2e7546); }
      .bar.mana { height: 12px; margin-top: 3px; }
      .bar.mana span { font-size: 10px; }
      .bar.mana.mana i { background: linear-gradient(#4a72c8, #33529a); }
      .bar.mana.rage i { background: linear-gradient(#c44a4a, #963333); }
      .bar.mana.energy i { background: linear-gradient(#d4c04a, #a08f33); }
      .bar.mana.focus i { background: linear-gradient(#c98a4a, #9a6733); }
      .bar.mana.runes i { background: linear-gradient(#6ab4d4, #4a86a0); }
      .uf-class { color: #8b93a7; font-weight: 400; font-size: 11px; margin-left: 4px; }
      .uf-meta .weapon { color: #9aa3b6; }

      /* ── 目标框的敌我区分（规格 777，与姓名板同一套语言）─────────
         在此之前目标框**不分敌我**：选队友和选敌人长得一模一样、血条恒绿，
         而它是治疗与集火共用的同一个控件。
         ★ 颜色由 JS 按色盲色板写在 inline style 上（与姓名板同一份色板），
           这里给**第二通道**：字形 ▲/◆ + 左侧色条 —— 17.2 不能只靠颜色。 */
      .unit-frame.uf-friendly { border-left: 3px solid var(--c-friendly); }
      .unit-frame.uf-hostile { border-left: 3px solid var(--c-hostile); }
      .unit-frame.uf-friendly .uf-name::before { content: '▲ '; opacity: .85; }
      .unit-frame.uf-hostile .uf-name::before { content: '◆ '; opacity: .85; }
      .uf-team { letter-spacing: 0; }
      .unit-frame.uf-friendly .uf-team { color: var(--c-friendly); }
      .unit-frame.uf-hostile .uf-team { color: var(--c-hostile); }

      /* 15.2：可打断=正常边框；不可打断=盾牌标记；物理射击准备=独立颜色 */
      .bar.cast { margin-top: 6px; height: 20px; }
      .bar.cast i { background: color-mix(in srgb, var(--school) 55%, #1b1f28); }

      /* ★★ M12：施法条的**连续**填充。
         HUD 每 50ms 重建一次 innerHTML，而 `width: X%` 在重建时是跳变的 ——
         20Hz 的台阶在 144Hz 屏上非常明显，而 7.5 的假读条博弈要玩家
         盯着这根条判断「还剩多少能打断」。
         做法：让 CSS 动画自己跑满全程，用**负的 animation-delay**
         把它拨到当前进度。元素重建时动画从正确的位置继续，
         中间那 50ms 由浏览器合成器补，与 JS 刷新率无关。 */
      @keyframes cast-fill { from { width: 0%; } to { width: 100%; } }
      .bar.cast i.anim { animation: cast-fill linear forwards; }
      .bar.cast.castable { border-color: var(--school); }
      .bar.cast.shielded { border-color: #8e96a8; border-style: dashed; }
      .bar.cast.shot { border-color: #d8b45c; box-shadow: inset 0 0 0 1px rgba(216,180,92,.35); }
      .bar.cast .shield { color: #cfd6e4; }

      #aim-hint { position: absolute; left: 50%; bottom: 164px; transform: translateX(-50%);
                  padding: 5px 12px; border-radius: 6px; font-size: 12px;
                  background: rgba(20,23,30,.9); border: 1px solid #3a6fa0; color: #9fd0ff; }
      #aim-hint.illegal { border-color: #8e96a8; border-style: dashed; color: #c9ced9; }
      #aim-hint.illegal::before { content: "✕ "; }

      #player-cast { position: absolute; left: 50%; bottom: 132px;
                     transform: translateX(-50%); width: 320px; }

      /* ⚠️ `z-index: 12` 是 1280×720 实测补的：技能栏与左下战斗日志、
         右下装备栏在小屏上真的会重叠，而它们后写 = 后画，第 9 格被装备栏
         **完全遮死**、第 1 格被日志压住 —— 玩家点不到也看不到。
         技能栏是操作面，压在两块纯展示面之上是正确的层序。
         （记分板 30 / 军械三选一 20 仍在它之上，那两块是模态。）*/
      #skill-bar { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
                   display: flex; gap: 6px; pointer-events: none; z-index: 12; }
      /* ★★ 容器保持 pointer-events:none（别挡住画布），**格子恢复 auto** ——
         与 :266 的 `.nameplate` 同一手法。缺这一行时 CombatHud 里那整条
         点击施法链（mousedown 委托）和 `.slot.usable:hover` 动效都是死代码：
         代码在、事件永远不会来。真机审计「技能栏点不动」的根因就是它。 */
      #skill-bar .slot { pointer-events: auto; cursor: pointer; }
      #skill-bar .slot { width: 108px; padding: 5px 7px; border-radius: 8px;
                         background: rgba(20,23,30,.9); border: 1px solid #2c313d;
                         border-top: 2px solid var(--school); }
      /* 键盘/辅助技术聚焦时的可见焦点环（格子对外声明了 role="button"）*/
      #skill-bar .slot:focus-visible { outline: 2px solid #9fd0ff; outline-offset: 1px; }
      #skill-bar .slot.blocked { opacity: .5; }
      #skill-bar .slot.usable { box-shadow: 0 0 0 1px color-mix(in srgb, var(--school) 45%, transparent); }
      #skill-bar .sk-head { display: flex; align-items: center; gap: 6px; margin: 2px 0 1px; }
      #skill-bar .sk-icon { flex: none; display: block; }
      #skill-bar .sk-name { font-size: 12px; font-weight: 600; white-space: nowrap; }
      #skill-bar .sk-meta { font-size: 10px; color: #7d8698; }
      #skill-bar .sk-nogcd { color: #9ad48f; }
      #skill-bar .sk-block { font-size: 10px; color: #e08a8a; margin-top: 2px; }

      /* ── 不可用原因的分级（合同 C1 的 blockers[]）────────────────
         ★ 四类对应玩家的四种动作：走位 / 等资源 / 等冷却 / 先解控。
         ★★ 17.2「不能只靠颜色」：每一类都有**三条**通道 ——
            颜色 + 左边框样式（实线/点线/虚线/双线）+ JS 给的字形前缀。
            色觉受限或截图压缩掉颜色时，边框与字形照样能分。            */
      #skill-bar .sk-block[data-blk="position"] { color: var(--c-hostile);
        border-left: 2px solid var(--c-hostile); padding-left: 4px; }
      #skill-bar .sk-block[data-blk="resource"] { color: #6fa8ff;
        border-left: 2px dotted #6fa8ff; padding-left: 4px; }
      #skill-bar .sk-block[data-blk="cooldown"] { color: #9aa3b6;
        border-left: 2px dashed #9aa3b6; padding-left: 4px; }
      #skill-bar .sk-block[data-blk="state"] { color: #d8a07e;
        border-left: 2px double #d8a07e; padding-left: 4px; }
      /* 位置类顺带给整格一圈红描边 —— 这条是「站错地方」，走两步就好了，
         值得在余光里看见（其余三类不加，否则满屏描边等于没描边）*/
      #skill-bar .slot:has(.sk-block[data-blk="position"]) { border-color: var(--c-hostile); }

      /* ── M12 技能栏打磨 ──────────────────────────────────────── */
      #skill-bar .slot {
        transition: transform .09s ease-out, box-shadow .12s ease-out, opacity .12s;
      }
      #skill-bar .slot.usable:hover { transform: translateY(-2px); }
      /* 真实图标：圆角 + 内描边，让方图与程序化 SVG 的边框语言一致 */
      #skill-bar .sk-img {
        border-radius: 5px; object-fit: cover;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.5);
      }
      #skill-bar .slot.blocked .sk-img { filter: grayscale(.75) brightness(.65); }

      /* ★ 冷却扫层：conic-gradient 顺时针扫过图标。
         ⚠️ 它是**第二**通道 —— `.sk-block` 里的秒数读数仍然照常显示。
         14.4 不允许把关键信息只留一个通道，而「还有多久能用」是
         15.2 明确要求提示的内容之一。 */
      #skill-bar .sk-head { position: relative; }
      /* X10 追加轮（用户：「冷却效果不明显，和超距禁用看上去差不多，应该像
         时钟一样转一圈」）：暗盘加深到 .88（原 .78 是层看不出来的暗膜），
         扫描沿上加一根 8° 的发亮金色「表针」—— 转到哪一眼可见，转完即好。
         与超距禁用（红描边 + 红字，无扫层）从此是两种长相。 */
      #skill-bar .sk-cd {
        position: absolute; left: 0; top: 0; width: 26px; height: 26px;
        border-radius: 5px; pointer-events: none;
        background: conic-gradient(
          rgba(8,10,16,.88) calc(var(--cd-deg) - 8deg),
          rgba(255,214,110,.95) calc(var(--cd-deg) - 8deg),
          rgba(255,214,110,.95) var(--cd-deg),
          transparent var(--cd-deg));
      }
      /* ★ 公共冷却扫层（合同 C1）。
         GCD 期间**七个格子一起转**，与自身冷却是两件事：
         一个 1.5 秒后全好，一个只有这格要等 30 秒。所以它**更浅**
         且带一圈内描边 —— 两层叠在同一个图标上必须一眼分得开。
         ⚠️ 生产方没填 gcdRemaining/gcdTotal 时 JS 压根不输出这个节点，
            不会画一个停在 0 度的假扫层。 */
      #skill-bar .sk-gcd {
        position: absolute; left: 0; top: 0; width: 26px; height: 26px;
        border-radius: 5px; pointer-events: none;
        background: conic-gradient(rgba(150,170,210,.30) var(--gcd-deg), transparent 0);
        box-shadow: inset 0 0 0 1px rgba(150,170,210,.22);
      }
      /* 按下技能时的一次脉冲，让「按了」有即时回执（不等服务器） */
      @keyframes sk-press { 0% { transform: scale(1); } 45% { transform: scale(.9); } 100% { transform: scale(1); } }
      #skill-bar .slot.pressed .sk-head { animation: sk-press .17s ease-out; }

      /* ── 技能 tooltip（第一次消费 SkillDef.description / counters）──
         ★ 自绘而不是原生 title：原生提示有 ~1 秒延迟、样式不可控，
           而这里要的是「扫一眼就知道这招怎么反制」。
         ★ 位置由 JS 算（格子上方、视口内钳位），这里只管长相。      */
      #skill-tip { position: absolute; left: 0; top: 0; width: 268px; z-index: 28;
                   background: rgba(14,17,23,.97); border: 1px solid #3a4152;
                   border-radius: 8px; padding: 9px 11px; font-size: 12px;
                   color: #cfd6e4; pointer-events: none;
                   box-shadow: 0 8px 26px rgba(0,0,0,.5); }
      #skill-tip .tip-head { display: flex; align-items: baseline; gap: 6px;
                             border-bottom: 1px solid #262b36; padding-bottom: 5px;
                             margin-bottom: 5px; border-top: 2px solid var(--school);
                             margin-top: -9px; padding-top: 7px; }
      #skill-tip .tip-name { font-size: 14px; color: #e8edf7; }
      #skill-tip .tip-school { font-style: normal; font-size: 11px; color: var(--school); }
      #skill-tip .tip-row { display: flex; gap: 8px; line-height: 1.5; }
      #skill-tip .tip-row span { color: #6f7a90; width: 34px; flex: none; }
      #skill-tip .tip-row b { font-weight: 500; color: #c9d1e0; }
      #skill-tip .tip-desc { margin-top: 6px; padding-top: 5px;
                             border-top: 1px solid #262b36; color: #b9c1d1; line-height: 1.6; }
      /* 反制单独一块：7.x 的整套博弈就写在这一行里，不能和说明混成一段 */
      #skill-tip .tip-counter { margin-top: 5px; color: #9ad48f; line-height: 1.55; }
      #skill-tip .tip-counter span { color: #6f7a90; margin-right: 5px; }

      /* ── 屏幕中部短提示（合同 C2）───────────────────────────────
         ★ 放在准星正下方一点：打断/失败/死亡这些要求**立刻改操作**的信息，
           必须落在玩家真正在看的地方；左下角的战斗日志是事后复盘用的。
         ⚠️ 不吃鼠标事件 —— 它盖在画面正中，能点就等于挡住了瞄准。      */
      #center-notice { position: absolute; left: 50%; top: 46%; transform: translate(-50%,-50%);
                       padding: 7px 18px; border-radius: 8px; font-size: 15px; font-weight: 600;
                       background: rgba(16,19,26,.86); border: 1px solid #4a5468;
                       color: #ffd9a8; text-shadow: 0 1px 3px #000;
                       pointer-events: none; opacity: 0; transition: opacity .3s ease-out; }
      #center-notice.show { opacity: 1; }

      /* ── M12 浮动伤害数字（14.1 命中反馈 / 17.2 可关闭）────────
         ★ 关闭由 `#combat-hud.no-damage-numbers` 的 display:none 兜底，
           但 FloatingNumbers 关掉时压根不建 DOM —— 见该文件头部。 */
      #floating-numbers { position: absolute; inset: 0; pointer-events: none; }
      .damage-number {
        position: absolute; left: 0; top: 0; white-space: nowrap;
        font-weight: 700; font-size: 15px; letter-spacing: .3px;
        text-shadow: 0 1px 3px #000, 0 0 8px rgba(0,0,0,.9);
        will-change: transform, opacity;
      }
      .fn-damage { color: #ffd9c0; }
      /* 暴击 = 从小炸大的爆炸字（X10 追加轮两轮拍板）：
         · 弹道是主通道（JS 的 POP_PEAK 5.0：0.09 秒从 0.35 炸到 ≈130px ——
           与角色身高同量级；回落仍保持 1.5 倍大字）
         · crit-flash 高亮闪是第二通道（色盲模式重映射颜色后仍成立）
         · 颜色分敌我：橙黄 = 打别人的暴击，红 = 自己挨的暴击 */
      .fn-crit   {
        color: #ffb057; font-size: 26px; font-weight: 900; letter-spacing: .6px;
        animation: crit-flash .28s ease-out;
      }
      .fn-crit-taken {
        color: #ff5a5a; font-size: 26px; font-weight: 900; letter-spacing: .6px;
        animation: crit-flash-red .28s ease-out;
      }
      @keyframes crit-flash {
        from { filter: brightness(2.4); text-shadow: 0 0 18px rgba(255,200,90,.95), 0 1px 3px #000; }
        to   { filter: brightness(1);   text-shadow: 0 1px 3px #000, 0 0 8px rgba(0,0,0,.9); }
      }
      @keyframes crit-flash-red {
        from { filter: brightness(2.4); text-shadow: 0 0 18px rgba(255,90,90,.95), 0 1px 3px #000; }
        to   { filter: brightness(1);   text-shadow: 0 1px 3px #000, 0 0 8px rgba(0,0,0,.9); }
      }
      .fn-heal   { color: #86e5a2; }
      .fn-absorb { color: #9fd2ff; }
      /* 未命中/免疫是**文字**不是数字 —— 显示 0 会被读成「打中但减到 0」 */
      .fn-miss   { color: #c2c8d6; font-size: 13px; font-weight: 600; }
      .fn-immune { color: #ffe9a8; font-size: 13px; font-weight: 600; }

      /* ── M12 受击屏幕闪烁（17.2 可独立关闭）────────────────────
         ★ 只在**四周边缘**变红，中间保持全透明 —— 全屏泛红会盖住
           14.4 点名不能隐藏的那些东西（控制状态、地面边界）。 */
      #screen-flash {
        position: absolute; inset: 0; pointer-events: none; opacity: 0;
        transition: opacity .09s ease-out;
        background: radial-gradient(ellipse at center,
                    transparent 52%, rgba(190,30,30,.42) 100%);
      }
      #combat-hud.no-screen-flash #screen-flash { display: none; }

      /* ★ M12：战斗日志此前是浅灰字直接压在深色背景上。引入 HDR 环境与
         地面贴图后背景可能是**亮的**（白天的石板地），同一组颜色在那上面
         几乎读不出来 —— 这是画面变亮带来的真实可读性回退，截图比对发现的。
         做法是给文字加描边阴影而不是调亮颜色：颜色还要继续承担
         ok/fail/interrupt 的语义区分（15.2），动了颜色就动了语义。 */
      /* ★ P10 再补一层：只加描边阴影仍然不够 —— 1280×720 实测，白天石板地
         上 11px 的浅色小字基本读不出来，而**死亡、施法失败、被打断这三类
         信息只走这一条通道**（没有别的地方说）。所以给一块半透明底板把
         背景压暗，再把字号 11→12px。⚠️ 颜色一个都没动：ok/fail/interrupt
         三色仍然承担 15.2 的语义区分，调亮就等于调语义。 */
      #combat-log { position: absolute; left: 14px; bottom: 14px; width: 380px;
                    font-size: 12px; font-variant-numeric: tabular-nums;
                    background: rgba(12,14,20,.55); border-radius: 6px; padding: 6px 8px;
                    text-shadow: 0 1px 2px #000, 0 0 6px rgba(0,0,0,.85); }
      .log { display: flex; gap: 6px; padding: 1px 0; color: #c2c9d8; }
      .log span { color: #808aa2; min-width: 34px; text-align: right; }
      .log.ok { color: #8fd0a0; }
      .log.fail { color: #e08a8a; }
      .log.interrupt { color: #e0c07e; }

      .nameplate { position: absolute; top: 0; left: 0; width: 108px; text-align: center;
                   pointer-events: auto; cursor: pointer; }
      .np-name { font-size: 11px; text-shadow: 0 1px 2px #000; }
      .np-hp { height: 4px; background: #2a2f3a; border-radius: 2px; overflow: hidden; margin-top: 2px; }
      .np-hp i { display: block; height: 100%; background: #d05a5a; }
      /* 规格 777 阵营区分：颜色由 JS 按色盲色板给，这里给**第二通道**（字形）
         —— 17.2「不能只靠颜色区分」。友方带 ▲，敌方带 ◆ */
      .nameplate.np-friendly .np-name::before { content: '▲ '; opacity: .85; }
      .nameplate.np-hostile .np-name::before { content: '◆ '; opacity: .85; }
      /* 选中/焦点的高亮**盖过**阵营色 —— 它们是「当前操作对象」，优先级更高 */
      .nameplate.selected .np-hp { box-shadow: 0 0 0 1px #ffd166; }
      .nameplate.selected .np-name { color: #ffd166 !important; font-weight: 600; }
      .nameplate.focused .np-name { color: #9ad0ff !important; }
      .np-cast { height: 4px; background: #2a2f3a; border-radius: 2px; overflow: hidden; margin-top: 2px; }
      .np-cast i { display: block; height: 100%; background: var(--school); }
      .np-cast.shielded { outline: 1px dashed #8e96a8; }

      /* ── M8 HUD（规格书 15.1 / 15.3 / 15.4）───────────────────── */
      /* 15.1 左侧：最多 12 名队友 */
      /* 15.1 左侧。试验场里 #stats 占了左上角，队伍框让到它下面 */
      #party-frame { position: absolute; left: 14px; top: 350px; width: 176px;
                     display: flex; flex-direction: column; gap: 4px; }
      .pf-member { background: rgba(20,23,30,.86); border: 1px solid #2c313d;
                   border-radius: 6px; padding: 4px 6px; }
      .pf-member.dead { opacity: .45; }
      .pf-top { display: flex; align-items: center; gap: 4px; font-size: 11px; }
      .pf-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pf-class { color: #7d8698; font-size: 10px; }
      .pf-flag { color: #ffd76a; margin-left: auto; }
      .pf-dead { color: #e08a8a; margin-left: auto; }
      .pf-bar { height: 6px; border-radius: 3px; overflow: hidden; background: #22262f;
                margin-top: 3px; }
      .pf-bar i { display: block; height: 100%; background: #4fbf70; }
      .pf-bar.res i { background: #5a8fd0; }
      .pf-ctrls { display: flex; gap: 3px; min-height: 12px; margin-top: 2px; }
      .pf-ctrl { font-size: 11px; color: #d0a8ff; }

      /* 15.1 右上：小地图 */
      #minimap { position: absolute; right: 14px; top: 14px; }

      /* 15.4 模式专属。
         ★ top 从 110px 下移到 158px：目标框（15.2 要求它显示职业、生命、
         资源、武器、控制状态、施法条）本身就有 ~130px 高，110px 会让
         模式面板压住目标框的下半截 —— 截图比对里「单手剑 + 盾牌」那行
         正好被盖掉，而那是 10.6 要求敌人可见的信息。 */
      #mode-hud { position: absolute; left: 50%; transform: translateX(-50%); top: 158px;
                  min-width: 240px; text-align: center; background: rgba(20,23,30,.86);
                  border: 1px solid #2c313d; border-radius: 8px; padding: 6px 12px;
                  font-size: 12px; color: #b9c1d1; }
      .mh-row { margin: 2px 0; }
      .mh-row.urgent { color: #ffb86a; font-weight: 600; }
      .mh-score { font-size: 18px; font-weight: 700; display: flex; gap: 10px;
                  justify-content: center; align-items: baseline; }
      .mh-vs { font-size: 11px; color: #6f7a90; font-weight: 400; }
      .team.red { color: #ff8a7a; }
      .team.blue { color: #7ab8ff; }
      .mh-flag { font-size: 11px; margin: 1px 0; }
      .mh-flag.red { color: #ff9c8a; }
      .mh-flag.blue { color: #8fc4ff; }
      .mh-msg { color: #ffd76a; font-size: 11px; }
      .mh-glyph { display: inline-block; width: 12px; font-weight: 700; }

      /* 速赢清单：O 键记分板（对局中看比分与双方名单） */
      #scoreboard { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
                    min-width: 420px; background: rgba(16,19,26,.94); border: 1px solid #3a4152;
                    border-radius: 10px; padding: 12px 18px 8px; font-size: 12px;
                    color: #b9c1d1; z-index: 30; }
      .sb-title { text-align: center; font-size: 11px; letter-spacing: 2px; color: #6f7a90; }
      .sb-score { display: flex; justify-content: center; gap: 14px; align-items: baseline;
                  font-size: 26px; font-weight: 700; margin: 4px 0 8px; }
      .sb-vs { font-size: 14px; color: #6f7a90; font-weight: 400; }
      .sb-columns { display: flex; gap: 14px; }
      .sb-col { flex: 1; border-top: 2px solid #2c313d; padding-top: 5px; }
      .sb-col.red { border-top-color: #ff8a7a; }
      .sb-col.blue { border-top-color: #7ab8ff; }
      .sb-row { display: flex; gap: 8px; padding: 2px 4px; border-radius: 4px; }
      .sb-row.self { background: rgba(122,184,255,.12); }
      .sb-row.dead { color: #6f7a90; }
      .sb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sb-class { color: #8d97ab; }
      .sb-hp { width: 40px; text-align: right; }
      .sb-empty { color: #4d5566; text-align: center; padding: 4px 0; }
      .sb-hint { text-align: center; font-size: 10px; color: #4d5566; margin-top: 8px; }

      /* 15.3 战场装备栏 */
      #loadout-panel { position: absolute; right: 14px; bottom: 14px; width: 250px;
                       background: rgba(20,23,30,.9); border: 1px solid #2c313d;
                       border-radius: 8px; padding: 8px 10px; font-size: 11px; }
      .lp-title { font-size: 10px; letter-spacing: 1px; color: #6f7a90; margin-bottom: 5px; }
      /* X10 追加轮：装备栏可收起。小签沿用面板底色，点击热区放大到整枚签 */
      .lp-toggle { background: rgba(20,23,30,.92); color: #aeb6c6; border: 1px solid rgba(255,255,255,.12);
        border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; pointer-events: auto; }
      .lp-toggle:hover { color: #e8e2cf; border-color: rgba(255,255,255,.28); }
      .lp-fold { float: right; padding: 0 6px; font-size: 11px; line-height: 14px; }
      .lp-section-label { font-size: 10px; color: #7d8698; margin: 5px 0 3px; }
      .lp-item { border: 1px solid #2c313d; border-radius: 5px; padding: 3px 5px; margin-bottom: 3px; }
      .lp-item.current { border-color: #4a6f8f; background: rgba(74,111,143,.14); }
      .lp-item.empty { color: #5d6577; text-align: center; }
      .lp-item-name { font-weight: 600; }
      .lp-tag { font-size: 9px; color: #6fd0ff; font-weight: 400; }
      .lp-adv { color: #9ad48f; font-size: 10px; }
      .lp-cost { color: #d8a07e; font-size: 10px; }
      .lp-swap { margin-top: 6px; }
      .lp-swap-label { font-size: 10px; color: #b9c1d1; }
      .lp-bar { height: 6px; border-radius: 3px; background: #22262f; overflow: hidden; margin-top: 2px; }
      .lp-bar i { display: block; height: 100%; background: #d0a85a; }
      .lp-warn { font-size: 9px; color: #d8a07e; margin-top: 2px; }
      .lp-interrupt { margin-top: 5px; color: #e08a8a; font-size: 10px; }
      .lp-compare { margin-top: 6px; border-top: 1px solid #2c313d; padding-top: 5px; }
      .lp-compare-label { font-size: 9px; color: #6f7a90; }
      .lp-diff { font-size: 10px; color: #c9d1e0; }

      /* ── 军械交互（10.2 / 10.4 / 10.5）─────────────────────────────
         ★ 提示与进度条压在准星下方、技能栏上方 —— 玩家拾取时视线就在那里。
         ★ 不可交互时**变暗但不隐藏**：10.2「看得到掉落物和所属职业」。   */
      #arsenal-prompt { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%);
                        background: rgba(20,23,30,.86); border: 1px solid #2c313d;
                        border-radius: 6px; padding: 5px 12px; font-size: 12px;
                        text-align: center; pointer-events: none; }
      #arsenal-prompt.ap-disabled { opacity: .55; border-color: #4a3a3a; }
      .ap-line { color: #e6ecf7; }
      .ap-hint { font-size: 10px; color: #d8a07e; margin-top: 2px; }
      #arsenal-progress { position: absolute; left: 50%; bottom: 122px; transform: translateX(-50%);
                          width: 190px; text-align: center; pointer-events: none; }
      .ap-prog-label { font-size: 10px; color: #b9c1d1; margin-bottom: 2px; }
      .ap-bar { height: 7px; border-radius: 4px; background: #22262f; overflow: hidden; }
      .ap-bar i { display: block; height: 100%; background: #6fd0ff; }
      .ap-toast { font-size: 11px; color: #e6ecf7; background: rgba(20,23,30,.86);
                  border: 1px solid #2c313d; border-radius: 6px; padding: 4px 10px; }
      /* 三选一面板：10.4「只向打开者显示其职业的三个横向选择」 */
      #arsenal-panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
                       background: rgba(16,19,25,.95); border: 1px solid #3a4152;
                       border-radius: 10px; padding: 14px 16px; z-index: 20; }
      .ap-title { font-size: 12px; letter-spacing: 1px; color: #cfd6e4; margin-bottom: 10px;
                  text-align: center; }
      .ap-row { display: flex; gap: 10px; }
      .ap-opt { width: 170px; text-align: left; cursor: pointer; color: #cfd6e4;
                background: rgba(30,34,44,.9); border: 1px solid #2c313d;
                border-radius: 7px; padding: 8px 10px; font: inherit; font-size: 11px; }
      .ap-opt:hover { border-color: #6fd0ff; background: rgba(45,60,78,.9); }
      .ap-opt-name { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
      .ap-opt-adv { color: #9ad48f; }
      .ap-opt-cost { color: #d8a07e; margin-top: 2px; }
      .ap-foot { font-size: 10px; color: #6f7a90; margin-top: 8px; text-align: center; }

      /* ── P13 大乱斗积分商店（玩家原话：「积分兑换装备和其他东西」）───── */
      /* 折叠态只有一行余额 —— 积分是本模式的核心反馈，不该藏进面板里 */
      #ffa-shop { position: absolute; left: 14px; top: 120px; width: 236px;
                  background: rgba(16,19,25,.9); border: 1px solid #3a4152;
                  border-radius: 8px; padding: 6px 8px; z-index: 18; font-size: 12px; }
      .fs-head { display: flex; justify-content: space-between; align-items: baseline;
                 cursor: pointer; }
      .fs-balance { color: #ffcf6f; font-weight: 700; }
      .fs-key { color: #6f7a90; font-size: 10px; }
      .fs-list { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
      .fs-row { display: flex; gap: 6px; align-items: baseline; width: 100%;
                text-align: left; cursor: pointer; color: #cfd6e4;
                background: rgba(30,34,44,.9); border: 1px solid #2c313d;
                border-radius: 5px; padding: 4px 6px; font: inherit; font-size: 11px; }
      .fs-row:hover { border-color: #6fd0ff; background: rgba(45,60,78,.9); }
      /* 17.2：买不起时**变暗**而不是隐藏 —— 玩家要知道攒到多少能买什么 */
      .fs-row.fs-poor { opacity: .45; }
      .fs-hotkey { color: #8b95a8; font-size: 10px; width: 10px; }
      .fs-name { flex: 1; }
      .fs-cost { color: #ffcf6f; }
      .fs-foot { font-size: 10px; color: #6f7a90; margin-top: 6px; }

      /* ── 16a 击杀播报与死亡回顾（docs/14 §16a）───────────────────── */
      #kill-feed { position: absolute; right: 14px; top: 90px; width: 260px;
                   text-align: right; pointer-events: none; font-size: 12px; }
      .kf-item { background: rgba(20,23,30,.72); border-radius: 5px;
                 padding: 3px 8px; margin-bottom: 3px; color: #e6ecf7; }
      .kf-item i { color: #8b95a8; font-style: normal; font-size: 11px; }
      .kf-streak { color: #ffcf6f; font-size: 11px; }
      /* 死亡回顾：居中偏上 —— 死亡镜头此时正在看自己的尸体 */
      #death-recap { position: absolute; left: 50%; top: 120px; transform: translateX(-50%);
                     width: 320px; background: rgba(16,19,25,.92);
                     border: 1px solid #3a4152; border-radius: 8px; padding: 10px 12px;
                     pointer-events: none; font-size: 12px; }
      .dr-title { font-size: 11px; color: #8b95a8; margin-bottom: 6px; text-align: center; }
      .dr-empty { color: #6f7a90; text-align: center; }
      .dr-row { display: flex; gap: 8px; align-items: baseline; padding: 2px 0;
                border-top: 1px solid #262b36; }
      .dr-row.dr-crit .dr-amt { color: #ffd45e; font-weight: 900; }
      .dr-t { color: #6f7a90; font-size: 10px; width: 38px; }
      .dr-src { color: #e6a0a0; flex: 1; }
      .dr-skill { color: #9fb4d0; font-size: 11px; }
      .dr-amt { color: #e6ecf7; width: 52px; text-align: right; }

      /* ── 16a 结算面板（16.1 统计 + 16.4 七项最佳玩家）───────────── */
      #lb-summary { margin: 10px 0 14px; }
      .ms-awards { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
                   margin-bottom: 12px; }
      .ms-award { background: rgba(30,34,44,.9); border: 1px solid #2c313d;
                  border-radius: 7px; padding: 6px 10px; min-width: 120px; }
      /* ★ 综合奖单独强调：16.4 要求它不能只按伤害评，所以它值得被看见 */
      .ms-award-top { border-color: #d0a85a; background: rgba(70,58,32,.55); }
      .ms-award-name { font-size: 10px; color: #8b95a8; }
      .ms-award-who { font-size: 13px; font-weight: 700; color: #e6ecf7; }
      .ms-award-why { font-size: 10px; color: #9ad48f; margin-top: 2px; }
      .ms-empty { color: #6f7a90; font-size: 12px; text-align: center; }
      .ms-table { width: 100%; border-collapse: collapse; font-size: 12px; }
      .ms-table th { font-size: 10px; color: #6f7a90; font-weight: 400;
                     padding: 3px 5px; border-bottom: 1px solid #2c313d; }
      .ms-table td { padding: 3px 5px; text-align: right; color: #c9d1e0; }
      .ms-table td.ms-name { text-align: left; }
      .ms-table tr.ms-red td.ms-name { color: #ff9d92; }
      .ms-table tr.ms-blue td.ms-name { color: #92bcff; }
      .ms-table tr.ms-self { background: rgba(74,111,143,.18); }

      /* ── M13 大厅（docs/14 §M13）──────────────────────────────────
         与 HUD 同一套技术栈：纯 DOM、同一色板、同一个 --ui-scale 缩放
         （由 LobbyShell 从 accessibility 读出写在 #lobby 上）。
         ★ #lobby 自身 pointer-events:none —— 对局期间它只剩隐藏页面和
           toast，不能挡住 3D 画布的鼠标；可见的页面各自恢复 auto。   */
      #lobby { position: fixed; inset: 0; z-index: 30; pointer-events: none;
               --ui-scale: 1; font-size: 14px; color: #cfd6e4; }
      #lobby > * { zoom: var(--ui-scale); }
      .lb-page { display: none; }
      .lb-page.active { display: flex; align-items: center; justify-content: center;
                        position: absolute; inset: 0; pointer-events: auto;
                        background: radial-gradient(1200px 700px at 50% 30%, #2a3352 0%, #171a28 70%); }
      /* ── X10 追加轮首页重构：Q 版高饱和标题页（用户拍板「不够 Q、吸引不了
         玩家」）。糖果色渐层天空 + 飘浮光斑；只作用于标题页，房间/选职业页
         保持深色作战底（信息密度高的页面糖果底会晃眼）。 ── */
      .lb-page[data-page="title"].active {
        background:
          radial-gradient(560px 340px at 12% 18%, rgba(255,255,255,.20), transparent 60%),
          radial-gradient(640px 420px at 88% 78%, rgba(255,214,110,.25), transparent 60%),
          linear-gradient(158deg, #43b7ff 0%, #6f7bff 46%, #b06bff 76%, #ff7ec2 100%);
      }
      .lb-title-wrap { width: 860px; max-width: 96vw; text-align: center; }
      .lb-hero { margin-bottom: 18px; }
      .lb-logo { margin: 0; font-family: Cinzel, serif; font-size: 64px; letter-spacing: 8px;
                 background: linear-gradient(180deg, #fff7d6 20%, #ffd23e 55%, #ff9a3d 100%);
                 -webkit-background-clip: text; background-clip: text; color: transparent;
                 filter: drop-shadow(0 4px 0 rgba(90,40,120,.55)) drop-shadow(0 10px 24px rgba(40,10,80,.35));
                 animation: lb-bob 3.2s ease-in-out infinite; }
      .lb-sub { color: rgba(255,255,255,.92); font-size: 14px; margin: 6px 0 0;
                text-shadow: 0 1px 6px rgba(50,20,90,.5); }
      @keyframes lb-bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      .lb-modes { display: flex; gap: 18px; align-items: stretch; justify-content: center; }
      .lb-mode { flex: 1; min-width: 0; text-align: center; border-radius: 22px; padding: 18px 20px 16px;
                 background: rgba(16,18,34,.82); backdrop-filter: blur(4px);
                 box-shadow: 0 14px 40px rgba(30,10,70,.35), inset 0 1px 0 rgba(255,255,255,.14);
                 transition: transform .15s ease; }
      .lb-mode:hover { transform: translateY(-4px); }
      .lb-mode-pvp { border: 3px solid #ff6a5e; }
      .lb-mode-ffa { border: 3px solid #ffc23e; }
      .lb-mode-art { font-size: 44px; line-height: 1; margin: 2px 0 6px;
                     filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
      .lb-mode h2 { margin: 0; font-size: 22px; color: #fff; letter-spacing: 2px; }
      .lb-mode-pvp h2 { color: #ffb0a8; } .lb-mode-ffa h2 { color: #ffe08a; }
      .lb-mode-tag { font-size: 12px; color: #aab3c8; margin: 4px 0 12px; }
      .lb-list-head { display: flex; align-items: center; gap: 6px; justify-content: center;
                      font-size: 12px; color: #8d97ab; margin: 12px 0 4px; }
      .lb-roomlist { max-height: 150px; overflow-y: auto; text-align: left; }
      .lb-room-row { gap: 8px; align-items: center; background: rgba(255,255,255,.05);
                     border-radius: 10px; padding: 4px 10px; margin: 6px 0; }
      .lb-empty { padding: 8px 0; text-align: center; }
      .lb-secondary { justify-content: center; margin-top: 16px; }
      .lb-secondary .lb-btn { width: auto; }
      .lb-name-mini { display: inline-flex; align-items: center; gap: 6px;
                      font-size: 12px; color: rgba(255,255,255,.85); }
      .lb-name-mini input { width: 110px; padding: 6px 10px; background: rgba(12,14,26,.7);
                            border: 2px solid rgba(255,255,255,.25); border-radius: 999px;
                            color: #fff; font-size: 13px; outline: none; text-align: center; }
      .lb-name-mini input:focus { border-color: #ffd23e; }
      .lb-devrow { justify-content: center; }
      .lb-panel { background: rgba(20,23,30,.92); border: 1px solid #2c313d;
                  border-radius: 16px; padding: 22px 26px; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
      .lb-title { width: 380px; text-align: center; }
      .lb-join input, .lb-share input {
        width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px 10px;
        background: #171b24; border: 1px solid #333a48; border-radius: 999px;
        color: #e6ebf4; font-size: 14px; outline: none; }
      .lb-join input:focus { border-color: #ffd23e; }
      .lb-row { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
      .lb-join { display: flex; gap: 8px; }
      .lb-join input { margin-top: 0; text-transform: uppercase; letter-spacing: 2px; text-align: center; }
      #lobby hr { border: none; border-top: 1px solid #2c313d; margin: 16px 0 10px; }
      .lb-fine { font-size: 11px; color: #7d8698; }
      /* Q 版按钮：圆角胶囊 + 厚底边（软糖立体感）+ 悬停放大 */
      .lb-btn { pointer-events: auto; cursor: pointer; font-weight: 600;
                border: 0; border-bottom: 4px solid #2b3350; background: #3d476e; color: #f2f5ff;
                border-radius: 999px; padding: 9px 18px; font-size: 14px; width: 100%;
                transition: transform .1s ease, filter .1s ease; }
      .lb-btn:hover { filter: brightness(1.18); transform: translateY(-1px); }
      .lb-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
      .lb-btn:disabled { opacity: .45; cursor: not-allowed; }
      .lb-btn.lb-primary { background: linear-gradient(180deg,#4f9cff,#3866e8); border-bottom-color: #24449c; font-weight: 800; }
      .lb-btn.lb-armed { background: linear-gradient(180deg,#3ecf7c,#22a45c); border-bottom-color: #157a41; }
      .lb-btn.lb-ghost { background: transparent; border-bottom-color: transparent; box-shadow: inset 0 0 0 2px rgba(255,255,255,.22); }
      .lb-btn.lb-small { width: auto; padding: 5px 14px; font-size: 12px; white-space: nowrap; }
      .lb-btn.lb-tiny { width: auto; padding: 2px 10px; font-size: 12px; }
      .lb-btn.lb-red { background: linear-gradient(180deg,#ff7a6e,#e84a44); border-bottom-color: #a32c28; }
      .lb-btn.lb-blue { background: linear-gradient(180deg,#5f9cff,#3f6ce8); border-bottom-color: #2a49a8; }
      /* 两大模式卡的 CTA：糖果大按钮 */
      .lb-btn.lb-cta { font-size: 17px; font-weight: 900; padding: 12px 18px; letter-spacing: 2px;
                       background: linear-gradient(180deg,#ff8a63,#ff5d5d); border-bottom-color: #b93838;
                       text-shadow: 0 1px 2px rgba(120,20,20,.5); }
      .lb-btn.lb-cta-ffa { background: linear-gradient(180deg,#ffd23e,#ff9a1f); border-bottom-color: #b96a10;
                           color: #4a2c00; text-shadow: none; }

      /* 房间页 */
      .lb-room { width: 620px; }
      .lb-room-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
      .lb-code { font-family: Cinzel, serif; font-size: 30px; letter-spacing: 6px; color: #e8d9a0; }
      .lb-share { flex: 1; display: flex; gap: 6px; align-items: center; max-width: 330px; }
      .lb-share input { font-size: 11px; color: #8d97ab; }
      .lb-roster { display: flex; gap: 10px; margin: 12px 0 4px; }
      .lb-col { flex: 1; border: 1px solid #2c313d; border-radius: 8px; padding: 8px 10px; min-height: 108px; }
      .lb-col h3 { margin: 0 0 6px; font-size: 13px; color: #b9c1d1; }
      .lb-col h3 i { color: #6f7a90; font-style: normal; font-weight: 400; }
      .lb-col-red { border-color: #52333a; } .lb-col-red h3 { color: #e08a8a; }
      .lb-col-blue { border-color: #33405f; } .lb-col-blue h3 { color: #8fb7ff; }
      .lb-col ul { list-style: none; margin: 0; padding: 0; }
      .lb-col li { display: flex; gap: 6px; align-items: baseline; padding: 3px 0; font-size: 13px; }
      .lb-col li span { color: #8d97ab; font-size: 11px; }
      .lb-col li i { color: #6fd0ff; font-style: normal; font-size: 11px; }
      .lb-col li em { margin-left: auto; font-style: normal; font-size: 11px; color: #5d6577; }
      .lb-col li em.lb-ok { color: #30a46c; }
      .lb-col li.lb-off { opacity: .5; }
      .lb-col li.lb-empty { color: #5d6577; font-size: 12px; }
      .lb-hints { margin: 4px 0; min-height: 16px; }
      .lb-hint { display: inline-block; font-size: 11px; color: #d8c07e; margin-right: 10px; }
      .lb-room-actions { border-top: 1px solid #2c313d; margin-top: 8px; padding-top: 4px; }

      /* 选职业页 */
      .lb-class { width: 900px; max-width: 96vw; }
      .lb-class-head { display: flex; justify-content: space-between; align-items: center; }
      .lb-class-head h2 { margin: 0; font-size: 18px; color: #e8d9a0; }
      .lb-class-body { display: flex; gap: 14px; margin-top: 12px; }
      .lb-cards { flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .lb-card { text-align: left; background: #1a1f2a; border: 1px solid #2c313d; border-radius: 9px;
                 padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px;
                 color: #cfd6e4; }
      .lb-card:hover { border-color: #4a6f8f; background: #202737; }
      .lb-card.selected { border-color: #d0a85a; box-shadow: 0 0 0 1px #d0a85a inset; }
      .lb-card-head b { font-size: 15px; color: #e6ebf4; }
      .lb-card-role { font-size: 11px; color: #6fd0ff; }
      .lb-card-skills { display: flex; gap: 3px; flex-wrap: wrap; margin: 3px 0; }
      .lb-card-skills .sk-icon { border-radius: 4px; }
      .lb-card-line { font-size: 11px; color: #9ad48f; }
      .lb-card-line.lb-weak { color: #d8a07e; }
      .lb-preview { width: 300px; border: 1px solid #2c313d; border-radius: 9px;
                    display: flex; flex-direction: column; align-items: center; justify-content: center;
                    background: #12151d; padding: 8px; }
      .lb-preview canvas { width: 280px; height: 340px; }

      /* ── M15 新手教学任务面板（docs/14 §M15）──────────────────────
         纯展示：面板 pointer-events:none，只有按钮恢复 —— 不挡画布。
         位置在右侧中部：左侧是队伍框、右上是小地图、右下是装备栏，
         这一块是 15.1 四区之外唯一的空档。                              */
      #tutorial-hud { position: fixed; right: 14px; top: 190px; width: 292px;
                      z-index: 25; pointer-events: none;
                      font-size: 13px; color: #cfd6e4; }
      .tut-panel, .tut-collapsed { background: rgba(20,23,30,.92);
                      border: 1px solid #3a4252; border-radius: 10px; padding: 12px 14px; }
      .tut-panel { border-color: #4a6f8f; }
      .tut-title { font-weight: 700; font-size: 15px; color: #e8d9a0; margin-bottom: 6px; }
      .tut-title i { font-style: normal; color: #6f7a90; font-size: 12px; }
      /* X10 追加轮：面板可收起（右上角小折叠钮）+ 技能栏去处提示 */
      .tut-fold { float: right; padding: 0 6px; font-size: 12px; line-height: 18px; }
      .tut-note { font-size: 11px; color: #8a93a6; margin-top: 8px; line-height: 1.5;
        border-top: 1px solid rgba(255,255,255,.07); padding-top: 6px; }
      .tut-lesson { font-size: 12px; color: #9ad48f; background: rgba(48,164,108,.08);
                    border-left: 2px solid #30a46c; padding: 5px 8px; margin: 4px 0 8px;
                    border-radius: 0 6px 6px 0; }
      .tut-steps { list-style: none; margin: 0; padding: 0; }
      .tut-step { display: flex; gap: 8px; padding: 4px 0; align-items: baseline; }
      .tut-step.locked { opacity: .38; }
      .tut-step.done { color: #7d8698; }
      .tut-step.done b { color: #30a46c; font-weight: 400; }
      .tut-step.current b { color: #ffd66e; }
      .tut-mark { width: 18px; text-align: center; flex: none; color: #6f7a90; }
      .tut-step.done .tut-mark { color: #30a46c; }
      .tut-step.current .tut-mark { color: #ffd66e; }
      .tut-goal { margin-top: 3px; font-size: 12px; line-height: 1.55; color: #cfd6e4; }
      .tut-subs { list-style: none; margin: 4px 0 0; padding: 0; font-size: 12px; color: #8d97ab; }
      .tut-subs li.done { color: #30a46c; }
      .tut-actions { margin-top: 8px; display: flex; gap: 8px; }
      .tut-btn { pointer-events: auto; cursor: pointer; border: 1px solid #3a4252;
                 background: #222836; color: #dfe6f2; border-radius: 6px;
                 padding: 5px 12px; font-size: 12px; }
      .tut-btn:hover { background: #2a3245; border-color: #4a6f8f; }
      .tut-btn.tut-ghost { background: transparent; color: #8d97ab; }

      /* 结算横幅（浮在战场上）与 toast */
      .lb-end { position: absolute; inset: 0; display: flex; align-items: center;
                justify-content: center; pointer-events: auto; background: rgba(10,12,17,.55); }
      /* ⚠️ display:flex 的优先级高于 UA 的 [hidden]{display:none} ——
         不补这条的话横幅**从一开始就悬在标题页上拦截所有点击**（首跑验收抓到的）*/
      .lb-end[hidden] { display: none; }
      .lb-end-panel { text-align: center; min-width: 300px; }
      .lb-end-panel h2 { font-family: Cinzel, serif; color: #e8d9a0; letter-spacing: 2px; }
      #lb-toast { position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
                  background: rgba(20,23,30,.95); border: 1px solid #4a6f8f; border-radius: 8px;
                  padding: 9px 18px; font-size: 13px; pointer-events: none; z-index: 40; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
