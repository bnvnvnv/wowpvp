<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wowpvp — 网页 3D 多人 PVP</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #14161c;
        color: #e6e8ee;
      }
      #app { max-width: 1100px; margin: 0 auto; padding: 32px 24px 64px; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      .sub { color: #8b93a7; margin: 0 0 24px; }
      .status { padding: 10px 14px; border-radius: 6px; margin-bottom: 24px; font-family: ui-monospace, monospace; }
      .status.ok { background: #17301f; color: #7ee0a0; }
      .status.err { background: #331a1a; color: #ef8a8a; }
      .status.wait { background: #23262f; color: #8b93a7; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
      .card { background: #1b1e26; border: 1px solid #2a2e3a; border-radius: 8px; padding: 14px 16px; }
      .card h2 { font-size: 16px; margin: 0 0 2px; }
      .role { color: #8b93a7; font-size: 12px; margin: 0 0 10px; }
      .stat { display: flex; gap: 12px; font-size: 12px; color: #a8b0c2; margin-bottom: 10px; }
      .pro { color: #7ee0a0; font-size: 12px; margin: 0 0 2px; }
      .con { color: #e0b87e; font-size: 12px; margin: 0 0 10px; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th, td { text-align: left; padding: 4px 6px; border-top: 1px solid #2a2e3a; }
      th { color: #8b93a7; font-weight: 500; }
      .note { margin-top: 32px; padding: 14px 16px; background: #1b1e26;
              border-left: 3px solid #4a90d9; border-radius: 4px; color: #a8b0c2; }
      code { background: #23262f; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
