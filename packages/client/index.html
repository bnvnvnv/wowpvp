<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wowpvp — M1 移动物理与自由镜头试验场</title>
    <!-- ★ 内联 favicon（奥术紫圆 + 星，14.2 色板）：零素材、零许可。
         没有它，部分浏览器（如 Edge headless）会自动请求 /favicon.ico 得到 404，
         在控制台产生一条资源错误 —— 而 verify:m12 #12d 断言控制台零错误，
         不能让验收结果取决于跑在哪个浏览器上。 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23c39bff'/%3E%3Cpath d='M8 3.2 9.2 6.8 13 8 9.2 9.2 8 12.8 6.8 9.2 3 8 6.8 6.8Z' fill='%23fff'/%3E%3C/svg%3E" />
    <style>
      /* ── M12 字体（assets/art/fonts，来源见 docs/09 §4）──────────
         ★ 只声明拉丁与拉丁扩展子集：中文正文仍走系统字体。
           Alegreya 没有中文字形，整段套上去会让每个汉字都走一次
           fallback，反而比不换字体更慢。数字与标题受益最大，
           而 HUD 里最需要「一眼读准」的恰恰是数字。
         ★ font-display: swap —— 字体没到之前先用系统字体渲染，
           不产生任何不可见文本期（15.2 的施法条读数不能有空窗）。 */
      @font-face {
        font-family: "Alegreya Sans";
        src: url("/art/fonts/alegreya-sans-500-latin.woff2") format("woff2");
        font-weight: 500; font-display: swap;
        unicode-range: U+0000-00FF, U+2000-206F, U+2190-21BB, U+2600-26FF;
      }
      @font-face {
        font-family: "Alegreya Sans";
        src: url("/art/fonts/alegreya-sans-400-latin.woff2") format("woff2");
        font-weight: 400; font-display: swap;
        unicode-range: U+0000-00FF, U+2000-206F, U+2190-21BB, U+2600-26FF;
      }
      @font-face {
        font-family: "Alegreya Sans";
        src: url("/art/fonts/alegreya-sans-700-latin.woff2") format("woff2");
        font-weight: 700; font-display: swap;
        unicode-range: U+0000-00FF, U+2000-206F, U+2190-21BB, U+2600-26FF;
      }
      /* 标题用的衬线体，只给比分/奖励这类「牌面」文字 */
      @font-face {
        font-family: "Cinzel";
        src: url("/art/fonts/cinzel-400-700-latin.woff2") format("woff2");
        font-weight: 400 700; font-display: swap;
        unicode-range: U+0000-00FF, U+2000-206F;
      }

      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #app { width: 100%; height: 100%; overflow: hidden; }
      body {
        font: 13px/1.6 "Alegreya Sans", system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #14161c;
        color: #e6e8ee;
      }
      /* M12 自定义光标。★ 保留 crosshair 作为兜底 —— 素材缺失时
         光标不能变成默认箭头，那会让「现在能不能点」失去提示 */
      #view { display: block; width: 100%; height: 100%;
              cursor: url("/art/ui/cursors/hand-default.png") 4 2, crosshair; }
      #view.cursor-attack { cursor: url("/art/ui/cursors/attack-sword.png") 4 2, crosshair; }
      #view.cursor-friendly { cursor: url("/art/ui/cursors/friendly-shield.png") 4 2, pointer; }

      #hud { position: fixed; inset: 0; pointer-events: none; padding: 14px; }
      .panel {
        position: absolute;
        background: rgba(20, 23, 30, 0.86);
        border: 1px solid #2c313d;
        border-radius: 8px;
        padding: 12px 14px;
        backdrop-filter: blur(6px);
      }

      #stats { top: 14px; left: 14px; min-width: 260px; font-variant-numeric: tabular-nums; }
      #stats .row { display: flex; align-items: baseline; gap: 8px; }
      #stats .row span { color: #8b93a7; width: 84px; flex: none; }
      #stats .row b { color: #e6e8ee; font-weight: 600; }
      #stats .row i { color: #5f6779; font-style: normal; font-size: 11px; margin-left: auto; }
      #stats b.ok { color: #7ee0a0; }
      #stats b.warn { color: #e0b87e; }
      #stats hr { border: 0; border-top: 1px solid #2c313d; margin: 7px 0; }

      /* M8：让开右上角的小地图（168px + 间距）*/
      #help { top: 196px; right: 14px; max-width: 360px; max-height: calc(100vh - 560px);
              overflow-y: auto; pointer-events: auto; }
      #help h3 { font-size: 12px; color: #6f9fd0; margin: 0 0 6px; font-weight: 600; }
      #help h3 + table + h3 { margin-top: 12px; }
      #help table { border-collapse: collapse; width: 100%; }
      #help td { padding: 2px 0; vertical-align: top; }
      #help td:first-child { width: 110px; white-space: nowrap; }
      #help .hint { color: #6b7488; margin-left: 6px; font-size: 11px; }
      #help ul { list-style: none; }
      #help li { color: #a8b0c2; padding: 2px 0 2px 12px; position: relative; }
      #help li::before { content: "·"; position: absolute; left: 2px; color: #6f9fd0; }
      #help b { color: #d9c07e; font-weight: 600; }
      kbd {
        display: inline-block; background: #262b36; border: 1px solid #3a4150;
        border-bottom-width: 2px; border-radius: 4px; padding: 0 5px;
        font: 11px/1.5 ui-monospace, monospace; color: #cfd6e4; margin-right: 3px;
      }

      /* ── M9 可访问性（规格书 17.2）─────────────────────────────
         界面缩放与语义色都走 CSS 自定义属性，由 CombatHud.applyAccessibility()
         写在 #combat-hud 上。★ 挂在根节点上是有意的：15.1 的四区加装备栏共五块
         面板，逐块应用一定会漏，而漏掉的那块只有把缩放调到 2.0 的人才会发现。
         下面的默认值仅在 JS 还没写入时生效。                              */
      #combat-hud {
        --ui-scale: 1;
        --c-hostile: #e5484d;
        --c-friendly: #30a46c;
        --c-neutral: #f5d90a;
        --c-danger: #e5484d;
        --c-own-flag: #e5484d;
        --c-enemy-flag: #3e63dd;
      }
      /* 17.2 界面缩放。★ 姓名板层排除在外 —— 它的 transform 是**投影坐标**，
         再套一层 scale 会让姓名板与 3D 里的角色错位。缩放要的是「UI 更大」，
         不是「把整个画面放大」。 */
      #combat-hud > *:not(#nameplates) {
        transform-origin: top left;
        zoom: var(--ui-scale);
      }
      /* 17.2 第三句：四项各自独立。这两条 class 由 applyAccessibility 切换 */
      #combat-hud.no-damage-numbers .damage-number { display: none !important; }
      #combat-hud.no-screen-flash .screen-flash { display: none !important; }

      /* ── M2 战斗 HUD（规格书 15.1 / 15.2）───────────────────── */
      #combat-hud { position: fixed; inset: 0; pointer-events: none; }
      #combat-hud .unit-frame {
        position: absolute; width: 260px; padding: 8px 10px;
        background: rgba(20,23,30,.88); border: 1px solid #2c313d; border-radius: 8px;
      }
      #target-frame { top: 14px; left: 50%; transform: translateX(-50%); }
      #focus-frame { top: 14px; left: calc(50% + 145px); }
      .uf-label { font-size: 10px; color: #6f7A90; letter-spacing: 1px; }
      .uf-name { font-weight: 600; margin-bottom: 4px; }
      .uf-meta { display: flex; gap: 8px; font-size: 11px; color: #8b93a7; margin-top: 4px; }
      .uf-meta .dbf { color: #e0a87e; }
      .flag { color: #e0c07e; font-size: 11px; }

      .bar { position: relative; height: 18px; border-radius: 4px; overflow: hidden;
             background: #22262f; border: 1px solid #333a47; }
      .bar i { position: absolute; inset: 0 auto 0 0; display: block; }
      .bar span { position: relative; display: flex; align-items: center; gap: 5px;
                  height: 100%; padding: 0 6px; font-size: 11px; }
      .bar em { font-style: normal; color: #aab2c4; font-size: 10px; }
      .bar.hp i { background: linear-gradient(#3f9b5d, #2e7546); }
      .bar.mana { height: 12px; margin-top: 3px; }
      .bar.mana span { font-size: 10px; }
      .bar.mana.mana i { background: linear-gradient(#4a72c8, #33529a); }
      .bar.mana.rage i { background: linear-gradient(#c44a4a, #963333); }
      .bar.mana.energy i { background: linear-gradient(#d4c04a, #a08f33); }
      .bar.mana.focus i { background: linear-gradient(#c98a4a, #9a6733); }
      .bar.mana.runes i { background: linear-gradient(#6ab4d4, #4a86a0); }
      .uf-class { color: #8b93a7; font-weight: 400; font-size: 11px; margin-left: 4px; }
      .uf-meta .weapon { color: #9aa3b6; }

      /* 15.2：可打断=正常边框；不可打断=盾牌标记；物理射击准备=独立颜色 */
      .bar.cast { margin-top: 6px; height: 20px; }
      .bar.cast i { background: color-mix(in srgb, var(--school) 55%, #1b1f28); }

      /* ★★ M12：施法条的**连续**填充。
         HUD 每 50ms 重建一次 innerHTML，而 `width: X%` 在重建时是跳变的 ——
         20Hz 的台阶在 144Hz 屏上非常明显，而 7.5 的假读条博弈要玩家
         盯着这根条判断「还剩多少能打断」。
         做法：让 CSS 动画自己跑满全程，用**负的 animation-delay**
         把它拨到当前进度。元素重建时动画从正确的位置继续，
         中间那 50ms 由浏览器合成器补，与 JS 刷新率无关。 */
      @keyframes cast-fill { from { width: 0%; } to { width: 100%; } }
      .bar.cast i.anim { animation: cast-fill linear forwards; }
      .bar.cast.castable { border-color: var(--school); }
      .bar.cast.shielded { border-color: #8e96a8; border-style: dashed; }
      .bar.cast.shot { border-color: #d8b45c; box-shadow: inset 0 0 0 1px rgba(216,180,92,.35); }
      .bar.cast .shield { color: #cfd6e4; }

      #aim-hint { position: absolute; left: 50%; bottom: 164px; transform: translateX(-50%);
                  padding: 5px 12px; border-radius: 6px; font-size: 12px;
                  background: rgba(20,23,30,.9); border: 1px solid #3a6fa0; color: #9fd0ff; }
      #aim-hint.illegal { border-color: #8e96a8; border-style: dashed; color: #c9ced9; }
      #aim-hint.illegal::before { content: "✕ "; }

      #player-cast { position: absolute; left: 50%; bottom: 132px;
                     transform: translateX(-50%); width: 320px; }

      #skill-bar { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
                   display: flex; gap: 6px; pointer-events: none; }
      #skill-bar .slot { width: 108px; padding: 5px 7px; border-radius: 8px;
                         background: rgba(20,23,30,.9); border: 1px solid #2c313d;
                         border-top: 2px solid var(--school); }
      #skill-bar .slot.blocked { opacity: .5; }
      #skill-bar .slot.usable { box-shadow: 0 0 0 1px color-mix(in srgb, var(--school) 45%, transparent); }
      #skill-bar .sk-head { display: flex; align-items: center; gap: 6px; margin: 2px 0 1px; }
      #skill-bar .sk-icon { flex: none; display: block; }
      #skill-bar .sk-name { font-size: 12px; font-weight: 600; white-space: nowrap; }
      #skill-bar .sk-meta { font-size: 10px; color: #7d8698; }
      #skill-bar .sk-block { font-size: 10px; color: #e08a8a; margin-top: 2px; }

      /* ── M12 技能栏打磨 ──────────────────────────────────────── */
      #skill-bar .slot {
        transition: transform .09s ease-out, box-shadow .12s ease-out, opacity .12s;
      }
      #skill-bar .slot.usable:hover { transform: translateY(-2px); }
      /* 真实图标：圆角 + 内描边，让方图与程序化 SVG 的边框语言一致 */
      #skill-bar .sk-img {
        border-radius: 5px; object-fit: cover;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.5);
      }
      #skill-bar .slot.blocked .sk-img { filter: grayscale(.75) brightness(.65); }

      /* ★ 冷却扫层：conic-gradient 顺时针扫过图标。
         ⚠️ 它是**第二**通道 —— `.sk-block` 里的秒数读数仍然照常显示。
         14.4 不允许把关键信息只留一个通道，而「还有多久能用」是
         15.2 明确要求提示的内容之一。 */
      #skill-bar .sk-head { position: relative; }
      #skill-bar .sk-cd {
        position: absolute; left: 0; top: 0; width: 26px; height: 26px;
        border-radius: 5px; pointer-events: none;
        background: conic-gradient(rgba(10,12,18,.78) var(--cd-deg), transparent 0);
      }
      /* 按下技能时的一次脉冲，让「按了」有即时回执（不等服务器） */
      @keyframes sk-press { 0% { transform: scale(1); } 45% { transform: scale(.9); } 100% { transform: scale(1); } }
      #skill-bar .slot.pressed .sk-head { animation: sk-press .17s ease-out; }

      /* ── M12 浮动伤害数字（14.1 命中反馈 / 17.2 可关闭）────────
         ★ 关闭由 `#combat-hud.no-damage-numbers` 的 display:none 兜底，
           但 FloatingNumbers 关掉时压根不建 DOM —— 见该文件头部。 */
      #floating-numbers { position: absolute; inset: 0; pointer-events: none; }
      .damage-number {
        position: absolute; left: 0; top: 0; white-space: nowrap;
        font-weight: 700; font-size: 15px; letter-spacing: .3px;
        text-shadow: 0 1px 3px #000, 0 0 8px rgba(0,0,0,.9);
        will-change: transform, opacity;
      }
      .fn-damage { color: #ffd9c0; }
      .fn-crit   { color: #ffb057; font-size: 21px; }
      .fn-heal   { color: #86e5a2; }
      .fn-absorb { color: #9fd2ff; }
      /* 未命中/免疫是**文字**不是数字 —— 显示 0 会被读成「打中但减到 0」 */
      .fn-miss   { color: #c2c8d6; font-size: 13px; font-weight: 600; }
      .fn-immune { color: #ffe9a8; font-size: 13px; font-weight: 600; }

      /* ── M12 受击屏幕闪烁（17.2 可独立关闭）────────────────────
         ★ 只在**四周边缘**变红，中间保持全透明 —— 全屏泛红会盖住
           14.4 点名不能隐藏的那些东西（控制状态、地面边界）。 */
      #screen-flash {
        position: absolute; inset: 0; pointer-events: none; opacity: 0;
        transition: opacity .09s ease-out;
        background: radial-gradient(ellipse at center,
                    transparent 52%, rgba(190,30,30,.42) 100%);
      }
      #combat-hud.no-screen-flash #screen-flash { display: none; }

      /* ★ M12：战斗日志此前是浅灰字直接压在深色背景上。引入 HDR 环境与
         地面贴图后背景可能是**亮的**（白天的石板地），同一组颜色在那上面
         几乎读不出来 —— 这是画面变亮带来的真实可读性回退，截图比对发现的。
         做法是给文字加描边阴影而不是调亮颜色：颜色还要继续承担
         ok/fail/interrupt 的语义区分（15.2），动了颜色就动了语义。 */
      #combat-log { position: absolute; left: 14px; bottom: 14px; width: 380px;
                    font-size: 11px; font-variant-numeric: tabular-nums;
                    text-shadow: 0 1px 2px #000, 0 0 6px rgba(0,0,0,.85); }
      .log { display: flex; gap: 6px; padding: 1px 0; color: #c2c9d8; }
      .log span { color: #808aa2; min-width: 34px; text-align: right; }
      .log.ok { color: #8fd0a0; }
      .log.fail { color: #e08a8a; }
      .log.interrupt { color: #e0c07e; }

      .nameplate { position: absolute; top: 0; left: 0; width: 108px; text-align: center;
                   pointer-events: auto; cursor: pointer; }
      .np-name { font-size: 11px; text-shadow: 0 1px 2px #000; }
      .np-hp { height: 4px; background: #2a2f3a; border-radius: 2px; overflow: hidden; margin-top: 2px; }
      .np-hp i { display: block; height: 100%; background: #d05a5a; }
      .nameplate.selected .np-hp { box-shadow: 0 0 0 1px #ffd166; }
      .nameplate.selected .np-name { color: #ffd166; font-weight: 600; }
      .nameplate.focused .np-name { color: #9ad0ff; }
      .np-cast { height: 4px; background: #2a2f3a; border-radius: 2px; overflow: hidden; margin-top: 2px; }
      .np-cast i { display: block; height: 100%; background: var(--school); }
      .np-cast.shielded { outline: 1px dashed #8e96a8; }

      /* ── M8 HUD（规格书 15.1 / 15.3 / 15.4）───────────────────── */
      /* 15.1 左侧：最多 12 名队友 */
      /* 15.1 左侧。试验场里 #stats 占了左上角，队伍框让到它下面 */
      #party-frame { position: absolute; left: 14px; top: 350px; width: 176px;
                     display: flex; flex-direction: column; gap: 4px; }
      .pf-member { background: rgba(20,23,30,.86); border: 1px solid #2c313d;
                   border-radius: 6px; padding: 4px 6px; }
      .pf-member.dead { opacity: .45; }
      .pf-top { display: flex; align-items: center; gap: 4px; font-size: 11px; }
      .pf-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pf-class { color: #7d8698; font-size: 10px; }
      .pf-flag { color: #ffd76a; margin-left: auto; }
      .pf-dead { color: #e08a8a; margin-left: auto; }
      .pf-bar { height: 6px; border-radius: 3px; overflow: hidden; background: #22262f;
                margin-top: 3px; }
      .pf-bar i { display: block; height: 100%; background: #4fbf70; }
      .pf-bar.res i { background: #5a8fd0; }
      .pf-ctrls { display: flex; gap: 3px; min-height: 12px; margin-top: 2px; }
      .pf-ctrl { font-size: 11px; color: #d0a8ff; }

      /* 15.1 右上：小地图 */
      #minimap { position: absolute; right: 14px; top: 14px; }

      /* 15.4 模式专属。
         ★ top 从 110px 下移到 158px：目标框（15.2 要求它显示职业、生命、
         资源、武器、控制状态、施法条）本身就有 ~130px 高，110px 会让
         模式面板压住目标框的下半截 —— 截图比对里「单手剑 + 盾牌」那行
         正好被盖掉，而那是 10.6 要求敌人可见的信息。 */
      #mode-hud { position: absolute; left: 50%; transform: translateX(-50%); top: 158px;
                  min-width: 240px; text-align: center; background: rgba(20,23,30,.86);
                  border: 1px solid #2c313d; border-radius: 8px; padding: 6px 12px;
                  font-size: 12px; color: #b9c1d1; }
      .mh-row { margin: 2px 0; }
      .mh-row.urgent { color: #ffb86a; font-weight: 600; }
      .mh-score { font-size: 18px; font-weight: 700; display: flex; gap: 10px;
                  justify-content: center; align-items: baseline; }
      .mh-vs { font-size: 11px; color: #6f7a90; font-weight: 400; }
      .team.red { color: #ff8a7a; }
      .team.blue { color: #7ab8ff; }
      .mh-flag { font-size: 11px; margin: 1px 0; }
      .mh-flag.red { color: #ff9c8a; }
      .mh-flag.blue { color: #8fc4ff; }
      .mh-msg { color: #ffd76a; font-size: 11px; }
      .mh-glyph { display: inline-block; width: 12px; font-weight: 700; }

      /* 15.3 战场装备栏 */
      #loadout-panel { position: absolute; right: 14px; bottom: 14px; width: 250px;
                       background: rgba(20,23,30,.9); border: 1px solid #2c313d;
                       border-radius: 8px; padding: 8px 10px; font-size: 11px; }
      .lp-title { font-size: 10px; letter-spacing: 1px; color: #6f7a90; margin-bottom: 5px; }
      .lp-section-label { font-size: 10px; color: #7d8698; margin: 5px 0 3px; }
      .lp-item { border: 1px solid #2c313d; border-radius: 5px; padding: 3px 5px; margin-bottom: 3px; }
      .lp-item.current { border-color: #4a6f8f; background: rgba(74,111,143,.14); }
      .lp-item.empty { color: #5d6577; text-align: center; }
      .lp-item-name { font-weight: 600; }
      .lp-tag { font-size: 9px; color: #6fd0ff; font-weight: 400; }
      .lp-adv { color: #9ad48f; font-size: 10px; }
      .lp-cost { color: #d8a07e; font-size: 10px; }
      .lp-swap { margin-top: 6px; }
      .lp-swap-label { font-size: 10px; color: #b9c1d1; }
      .lp-bar { height: 6px; border-radius: 3px; background: #22262f; overflow: hidden; margin-top: 2px; }
      .lp-bar i { display: block; height: 100%; background: #d0a85a; }
      .lp-warn { font-size: 9px; color: #d8a07e; margin-top: 2px; }
      .lp-interrupt { margin-top: 5px; color: #e08a8a; font-size: 10px; }
